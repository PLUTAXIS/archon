# Risk weights (proposed, pending Wrik). Keyed by flag name.
rules:
  UNVERIFIED_FORMULA: 20
  VOLATILE_FUNCTION: 15
  ERROR_SUPPRESSED: 15
  APPROX_LOOKUP_DEFAULT: 25
  APPROX_LOOKUP: 10
  RUNNING_BALANCE: 5
  NESTED_IF_DEPTH: 5  # per IF level
# pattern id -> flag (null = explicit zero-risk decision)
pattern_flags:
  running_balance: RUNNING_BALANCE
  tiered_rate_table: NESTED_IF_DEPTH
  product: null
  ratio: null
  difference: null
  sum: null
  rounding: null
  vlookup_exact: null
  vlookup_approx: APPROX_LOOKUP
  vlookup_default: APPROX_LOOKUP_DEFAULT
  index_match_exact: null
  error_suppression: ERROR_SUPPRESSED
  volatile_now: VOLATILE_FUNCTION
  volatile_today: VOLATILE_FUNCTION
  volatile_rand: VOLATILE_FUNCTION

server {
    listen 8080;
    root /usr/share/nginx/html;

    # 20 MB upload limit in the API, plus multipart overhead
    client_max_body_size 21m;

    location /api/ {
        proxy_pass http://api:10000/;
        # large workbooks take tens of seconds to audit
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}

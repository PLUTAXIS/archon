name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Install (Python 3.12, locked)
        run: uv sync --locked --python 3.12
      - name: Lint
        # archon/ingest is tested below but not lint-gated yet (27 findings, mostly broad excepts).
        run: >-
          uv run ruff check
          archon/contracts archon/explain archon/formula archon/cluster archon/graph
          archon/scrubber archon/api archon/risk archon/pipeline.py archon/names.py
          run_pipeline.py scripts/benchmark.py
          tests/contracts tests/explain tests/test_pipeline.py tests/test_scorecard.py
          tests/test_cluster_memo.py tests/test_names.py
      - name: Types
        run: uv run mypy --strict archon/contracts
      - name: Unit tests (formula, cluster, graph, scrubber, ingest, explain, contracts)
        run: uv run pytest -q --ignore=tests/test_pipeline.py --ignore=tests/test_determinism_golden.py
      - name: End-to-end pipeline and golden determinism
        run: uv run pytest -q tests/test_pipeline.py tests/test_determinism_golden.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archon-web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: archon-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

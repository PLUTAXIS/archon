name: Stale

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 14
          exempt-draft-pr: true
          exempt-pr-labels: 'keep-open,security'
          exempt-issue-labels: 'keep-open,security'
          stale-pr-message: 'This PR has had no activity for 30 days. Add the keep-open label or push a commit, or it will be closed in 14 days.'
          stale-issue-message: 'This issue has had no activity for 30 days. Comment or add keep-open, or it will be closed in 14 days.'

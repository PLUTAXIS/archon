name: PR Doctor

# pull_request_target gives PRs from forks a token that can comment and request
# reviewers. It is safe here because the job checks out the BASE branch only and
# the script reads API data: PR code is never checked out or executed.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-doctor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PR Doctor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: python3 .github/scripts/archon_bot.py pr

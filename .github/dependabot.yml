version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-deps:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/archon-web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-deps:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
